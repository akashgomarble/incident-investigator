<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>Incident Investigator</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#16181d;--muted:#5d6472;--line:#e3e6eb;--accent:#2f6fde;--accent-soft:#e8f0fd;
--warn:#8a5a00;--warn-bg:#fff6e0;--bad:#b42318;--bad-bg:#fdecea;--ok:#18794e;--ok-bg:#e6f6ee;--chip:#eef1f5;--code:#f1f3f6;
--shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
--orchestrator:#6b5bd6;--observability:#12806a;--dependency:#b76a08;--reasoning:#2f6fde;--critic:#c23b5a;--reporting:#5d6472;--baseline:#2f6fde}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#171a21;--ink:#e8eaee;--muted:#9aa3b2;--line:#272c36;--accent:#7aa7ff;
--accent-soft:#1c2740;--warn:#f5c26b;--warn-bg:#2a2214;--bad:#ff8a80;--bad-bg:#2c1716;--ok:#5fd39a;--ok-bg:#122a1f;--chip:#222733;--code:#1d212a;--shadow:none;
--orchestrator:#a79bff;--observability:#4fd1b3;--dependency:#f0b45c;--reasoning:#7aa7ff;--critic:#ff8fa8;--reporting:#aab2c0;--baseline:#7aa7ff}}
*{box-sizing:border-box}
html,body{margin:0;max-width:100%;overflow-x:hidden}
body{background:var(--bg);color:var(--ink);font:14.5px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,select,input{font:inherit;color:inherit}
code,pre,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
code{font-size:12px;background:var(--chip);padding:1px 5px;border-radius:4px}
nav{background:var(--card);border-bottom:1px solid var(--line)}
nav>div{max-width:1400px;margin:0 auto;padding:10px 16px;display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
nav b{font-size:15px}nav span{color:var(--muted);font-size:13px}
main{max-width:1400px;margin:0 auto;padding:14px 16px 28px}

/* toolbar */
.bar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.fld{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:600;min-width:0}
.fld select{font-size:14px;font-weight:400;padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);max-width:min(100%,330px)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--bg)}
.seg button{border:0;background:none;padding:7px 12px;font-size:13.5px;cursor:pointer;color:var(--muted);white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.seg button:disabled{opacity:.45;cursor:not-allowed}
.sp{flex:1}
.go{border:0;border-radius:10px;padding:9px 20px;font-weight:600;font-size:14.5px;background:var(--accent);color:#fff;cursor:pointer;white-space:nowrap}
@media (prefers-color-scheme:dark){.go{color:#0f1115}}
.go.stop{background:var(--bad)}
.go:disabled{opacity:.5;cursor:default}
.hint{font-size:12.5px;color:var(--muted);margin:8px 2px 0}
.hide{display:none!important}

/* agent strip + meters */
.strip{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:stretch}
.ag{flex:1 1 150px;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 11px;box-shadow:var(--shadow);border-top:3px solid var(--c)}
.ag .n{font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:7px}
.ag .d{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.ag .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag[data-s=run] .d{background:var(--c);animation:pulse 1s infinite}
.ag[data-s=run] .s{color:var(--ink)}
.ag[data-s=done] .d{background:var(--ok)}
.ag[data-s=fail] .d{background:var(--bad)}
@keyframes pulse{50%{opacity:.3}}
.meters{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:10px;font-size:12.5px;color:var(--muted);align-items:center}
.meter{display:flex;align-items:center;gap:7px;white-space:nowrap}
.meter b{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:600}

/* two panels */
.shell{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);gap:14px;margin-top:12px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;height:calc(100vh - 250px);min-height:520px}
@media (max-width:960px){.shell{grid-template-columns:1fr}.panel{height:auto;max-height:78vh;min-height:360px}}
.phead{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);font-weight:600;font-size:14px}
.phead .live{font-weight:500;font-size:12.5px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shimmer{background:linear-gradient(90deg,var(--muted) 30%,var(--ink) 50%,var(--muted) 70%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 1.5s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.scroll{overflow-y:auto;flex:1;padding:14px;display:flex;flex-direction:column;gap:12px;min-height:0}
.tabs{display:flex;gap:2px;padding:6px 8px 0;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 12px;font-size:13.5px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
.tabs button:disabled{opacity:.45;cursor:default}
.empty{margin:auto;text-align:center;color:var(--muted);max-width:440px;padding:24px 12px}
.empty h3{color:var(--ink);font-size:17px;margin:0 0 6px}
.empty p{margin:0 0 6px;font-size:14px}

/* feed */
.u-msg{align-self:flex-end;max-width:92%;background:var(--chip);border-radius:14px;padding:11px 14px}
.u-msg .t{font-weight:600;margin-bottom:3px}
.u-msg .m{font-size:12.5px;color:var(--muted);margin-bottom:6px}
.u-msg ul{margin:6px 0 0;padding-left:18px;font-size:13.5px}
.blk{display:flex;flex-direction:column;gap:8px}
.bh{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.bh .who{color:var(--c)}
.bh .tm{margin-left:auto;font-weight:400;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.badge{width:20px;height:20px;border-radius:6px;background:var(--c);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;flex:none}
@media (prefers-color-scheme:dark){.badge{color:#0f1115}}
.txt{font-size:14px;line-height:1.55;word-break:break-word}
.slim{font-size:12.5px;color:var(--muted);padding-left:28px}
.slim.w{color:var(--warn)}.slim.b{color:var(--bad)}
.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:1px 9px;font-size:11.5px;color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.no{background:var(--bad-bg);color:var(--bad)}
.chip.w{background:var(--warn-bg);color:var(--warn)}.chip.c{background:var(--accent-soft);color:var(--accent)}
button.ref{border:0;cursor:pointer;background:var(--accent-soft);color:var(--accent);border-radius:5px;padding:0 6px;font:600 11.5px ui-monospace,SFMono-Regular,Menlo,monospace;margin:0 3px 2px 0}
button.ref:hover{outline:1px solid var(--accent)}
.task{border:1px solid var(--line);border-left:3px solid var(--c);border-radius:11px;background:var(--bg);padding:10px 12px;display:flex;flex-direction:column;gap:7px}
.task .th{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:600;flex-wrap:wrap}
.task .th .who{color:var(--c)}
.task .obj{font-size:13.5px;line-height:1.5}
.task .obj.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.task .ans{font-size:13.5px;border-top:1px dashed var(--line);padding-top:7px}
.task .ans b{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);display:block}
.tool{border:1px solid var(--line);border-radius:9px;background:var(--card);overflow:hidden}
.tool>button{display:flex;align-items:center;gap:8px;width:100%;padding:6px 10px;background:none;border:0;cursor:pointer;text-align:left;font-size:12.5px}
.tool .tn{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--c);font-weight:600;white-space:nowrap}
.tool .ta{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px}
.tool .tb{display:none;border-top:1px solid var(--line);padding:9px 10px;font-size:12px}
.tool[data-open="1"] .tb{display:block}
.tool .tb b{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:0 0 3px}
.tool pre{margin:0 0 8px;background:var(--code);border-radius:7px;padding:7px 9px;font-size:11.5px;white-space:pre-wrap;word-break:break-word;max-height:260px;overflow:auto}
.tool.flash,.fd.flash,.hy.flash{animation:flash 1.6s ease}
@keyframes flash{0%,40%{box-shadow:0 0 0 2px var(--accent)}100%{box-shadow:0 0 0 2px transparent}}
.fnd{font-size:13px;line-height:1.5;display:flex;gap:7px;align-items:baseline}
.fnd .x{flex:1;min-width:0;word-break:break-word}
.hrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 9px;align-items:center;font-size:13.5px;border:1px solid var(--line);border-radius:10px;padding:8px 11px;background:var(--bg)}
.hrow.rej{opacity:.6}.hrow.rej .ht{text-decoration:line-through}
.cbar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--chip);position:relative;overflow:visible}
.cbar u{display:block;height:100%;border-radius:3px;background:var(--accent);transition:width .5s}
.cbar s{position:absolute;top:-3px;width:2px;height:12px;background:var(--critic)}
.num{font-variant-numeric:tabular-nums;font-weight:600}
.crit{border:1px solid var(--line);border-left:3px solid var(--critic);border-radius:11px;background:var(--bg);padding:10px 12px;display:flex;flex-direction:column;gap:7px;font-size:13.5px}
.crit ul{margin:0;padding-left:18px}.crit li{margin:3px 0}
.crit h5,.rp h5{margin:4px 0 0;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.outc{border-radius:11px;padding:10px 12px;font-size:13.5px;background:var(--ok-bg)}
.outc.inc{background:var(--warn-bg)}
.donecard{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 12px;border-top:1px dashed var(--line);padding-top:10px}
.donecard b{color:var(--ink)}

/* right panel */
.hy{border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:var(--bg);display:flex;flex-direction:column;gap:7px}
.hy.rej{opacity:.65}
.hy .top{display:flex;gap:8px;align-items:baseline}
.hy .top .ht{font-weight:600;flex:1;min-width:0}
.hy .meta{display:flex;flex-wrap:wrap;gap:5px}
.hy .hist{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.hy details{font-size:13px}.hy summary{cursor:pointer;color:var(--muted);font-size:12.5px}
.hy ol{margin:6px 0 0;padding-left:20px}.hy li{margin:4px 0}
.assumed{color:var(--warn);font-size:12px}
.fd{border:1px solid var(--line);border-radius:11px;padding:9px 12px;background:var(--bg);font-size:13.5px;display:flex;flex-direction:column;gap:5px}
.fd .top{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.fd q{display:block;font-size:12px;color:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;quotes:none;word-break:break-word}
.rp{display:flex;flex-direction:column;gap:10px;font-size:14px}
.rp .banner{border-radius:12px;padding:12px 14px;background:var(--ok-bg)}
.rp .banner.inc{background:var(--warn-bg)}
.rp .banner .o{font-weight:700;font-size:15px}
.rp ul,.rp ol{margin:0;padding-left:20px}.rp li{margin:5px 0}
.rp table{border-collapse:collapse;width:100%;font-size:13px}
.rp th,.rp td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.rp th{color:var(--muted);font-weight:600}
.rp td.r{text-align:right;font-variant-numeric:tabular-nums}
.key{border:1px dashed var(--line);border-radius:11px;padding:9px 12px;font-size:13.5px}
.key summary{cursor:pointer;font-weight:600}
.statg{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px}
.statg div{border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:var(--bg)}
.statg b{display:block;font-size:16px;font-variant-numeric:tabular-nums}.statg span{font-size:11.5px;color:var(--muted)}
#trace{font:11.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;word-break:break-word;gap:0}
#trace div{padding:1px 0}#trace .k{color:var(--accent)}
</style>
</head>
<body>
<nav><div><b>Incident Investigator</b><span>Six agents investigate a production incident around one shared state. Watch it happen.</span></div></nav>
<main>
  <div class="bar">
    <div class="fld">Mode
      <div class="seg" id="mode"><button data-v="live" aria-pressed="true">Run now</button><button data-v="replay" aria-pressed="false">Replay a recorded run</button></div>
    </div>
    <label class="fld" id="f-inc">Incident<select id="inc"></select></label>
    <div class="fld" id="f-sys">System
      <div class="seg" id="sys"><button data-v="multi" aria-pressed="true">Multi-agent team</button><button data-v="single" aria-pressed="false">Single agent</button></div>
    </div>
    <label class="fld" id="f-chaos">Random tool faults<select id="chaos"><option value="0">none</option><option value="0.1">10% of calls</option><option value="0.3">30% of calls</option></select></label>
    <label class="fld" id="f-crash">Crash an agent once<select id="crash"><option value="">none</option><option>observability</option><option>dependency</option><option>reasoning</option><option>critic</option><option>reporting</option></select></label>
    <label class="fld hide" id="f-recset">Run set<select id="recset"></select></label>
    <label class="fld hide" id="f-recinc">Incident<select id="recinc"></select></label>
    <label class="fld hide" id="f-rec">Recording<select id="rec"></select></label>
    <label class="fld hide" id="f-speed">Speed<select id="speed"><option value="4">4×</option><option value="10" selected>10×</option><option value="30">30×</option><option value="120">120×</option></select></label>
    <span class="sp"></span>
    <button class="go" id="go">Investigate</button>
  </div>
  <div class="hint" id="hint"></div>

  <div class="strip" id="strip"></div>
  <div class="meters" id="meters"></div>

  <div class="shell">
    <section class="panel">
      <div class="phead"><span>Investigation</span><span class="live" id="live"></span></div>
      <div class="scroll" id="feed"></div>
    </section>
    <section class="panel">
      <div class="tabs" role="tablist" id="tabs">
        <button data-t="hyp" aria-selected="true">Hypotheses</button>
        <button data-t="ev" aria-selected="false">Evidence <span id="evn"></span></button>
        <button data-t="rep" aria-selected="false" disabled>Report</button>
        <button data-t="trace" aria-selected="false">Trace</button>
      </div>
      <div class="scroll" id="hyp"></div>
      <div class="scroll hide" id="ev"></div>
      <div class="scroll hide" id="rep"></div>
      <div class="scroll hide" id="trace"></div>
    </section>
  </div>
</main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NAMES={orchestrator:'Orchestrator',observability:'Observability',dependency:'Dependency',reasoning:'Reasoning',critic:'Critic',reporting:'Reporting',baseline:'Single agent',code:'Decision rule'};
const DOING={orchestrator:'planning the investigation',observability:'querying logs and metrics',dependency:'checking changes and dependencies',reasoning:'comparing hypotheses',critic:'reviewing the analysis',reporting:'writing the report',baseline:'investigating alone'};
const ROLES={multi:['orchestrator','observability','dependency','reasoning','critic','reporting'],single:['baseline']};
const feed=$('feed');
let META=null,es=null,jobId=null,busy=false,tick=null,S=null;
const opt={mode:'live',sys:'multi',llm:'real'};

/* ---------- controls ---------- */
function seg(id,key,cb){$(id).addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled||busy)return;
  opt[key]=b.dataset.v;[...$(id).children].forEach(x=>x.setAttribute('aria-pressed',x===b));cb&&cb();});}
function setSeg(id,key,v){opt[key]=v;[...$(id).children].forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===v));}
function syncMode(){const live=opt.mode==='live';
  ['f-inc','f-sys','f-chaos','f-crash'].forEach(i=>$(i).classList.toggle('hide',!live));
  ['f-recset','f-recinc','f-rec','f-speed'].forEach(i=>$(i).classList.toggle('hide',live));
  $('f-crash').classList.toggle('hide',!live||opt.sys!=='multi');
  $('go').textContent=live?'Investigate':'Replay';hint();if(!busy)idle();}
function hint(){let h='';
  if(opt.mode==='replay')h='Replays a saved run event by event. Long model waits are shortened; the clock shows the real elapsed time of the original run.';
  else h='Real model'+(META&&META.model?' ('+esc(META.model)+')':'')+': a multi-agent run takes about 2 to 4 minutes and roughly 200k tokens; a single-agent run about 1 minute.';
  $('hint').innerHTML=h;}
seg('mode','mode',syncMode);seg('sys','sys',syncMode);
$('inc').addEventListener('change',()=>{if(!busy)idle();});
$('rec').addEventListener('change',()=>{if(!busy)idle();});
/* The recording picker is narrowed by run set and incident, so it never lists hundreds of runs at once. */
const SYS_NAME={multi:'Multi-agent team',single:'Single agent',nocritic:'Team without Critic'};
function recLabel(r){const m=/· trial (\d+)$/.exec(r.label);return m?`${SYS_NAME[r.system]||r.system} · trial ${m[1]}`:r.label;}
function fillRecs(keep){const set=$('recset').value,inSet=META.recordings.filter(r=>r.set===set);
  const incs=[...new Set(inSet.map(r=>r.incident))].sort();
  const title=id=>{const i=META.incidents.find(x=>x.id===id);return i?`${id} · ${i.title}`:id;};
  const want=keep&&incs.includes($('recinc').value)?$('recinc').value:incs[0];
  $('recinc').innerHTML=incs.map(i=>`<option value="${esc(i)}">${esc(title(i))}</option>`).join('');$('recinc').value=want;
  $('rec').innerHTML=inSet.filter(r=>r.incident===want).map(r=>`<option value="${esc(r.id)}">${esc(recLabel(r))}</option>`).join('');}
function selectRecording(id){const r=META.recordings.find(x=>x.id===id);if(!r)return;
  $('recset').value=r.set;fillRecs(false);$('recinc').value=r.incident;fillRecs(true);$('rec').value=id;}
$('recset').addEventListener('change',()=>{if(busy)return;fillRecs(true);idle();});
$('recinc').addEventListener('change',()=>{if(busy)return;fillRecs(true);idle();});

/* ---------- state ---------- */
function fresh(system){return {system,tasks:{},order:[],findings:{},hyps:{},run:{},turns:{},seen:{},cap:null,round:1,
  n:{tool:0,llm:0,tokens:0},t:0,t0:null,block:null,reasonBlk:null,solo:null,failed:{}};}
function currentIncident(){if(!META)return null;
  const id=opt.mode==='live'?$('inc').value:(META.recordings.find(r=>r.id===$('rec').value)||{}).incident;
  return META.incidents.find(i=>i.id===id)||null;}
function incidentHTML(i){return `<div class="t">${esc(i.id)} · ${esc(i.title)}</div>
  <div class="m">${esc(i.severity)} · reported by ${esc(i.reporter)} on <code>${esc(i.affected_service)}</code> at ${esc(i.reported_at)}</div>
  <div>${esc(i.description)}</div>${i.symptoms&&i.symptoms.length?'<ul>'+i.symptoms.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ul>':''}`;}
function idle(){const sys=opt.mode==='live'?opt.sys:((META&&META.recordings.find(r=>r.id===$('rec').value))||{}).system||'multi';
  S=fresh(sys);strip();meters();$('live').textContent='';
  const i=currentIncident();
  feed.innerHTML=`<div class="empty"><h3>${opt.mode==='live'?'Ready to investigate':'Ready to replay'}</h3>
    <p>${sys==='multi'?'The Orchestrator plans tasks, two specialists gather evidence in parallel, the Reasoning Agent builds competing hypotheses, the Critic challenges them and can send the team back for more, and the Reporting Agent writes it up.':'One agent with all six tools works the incident alone. This is the baseline the team is compared against.'}</p></div>`
    +(i?`<div class="u-msg">${incidentHTML(i)}</div>`:'');
  $('hyp').innerHTML='<div class="empty"><p>Hypotheses appear here as the Reasoning Agent forms them, with confidence moving round by round.</p></div>';
  $('ev').innerHTML='<div class="empty"><p>Every finding lands here with the tool call it cites and whether its quote was found in that tool\'s output.</p></div>';
  $('rep').innerHTML='';$('trace').innerHTML='';$('evn').textContent='';
  $('tabs').querySelector('[data-t=rep]').disabled=true;tab('hyp');}

/* ---------- agent strip + meters ---------- */
function strip(){$('strip').innerHTML=ROLES[S.system].map(r=>`<div class="ag" id="ag-${r}" data-s="idle" style="--c:var(--${r})">
  <div class="n"><span class="d"></span>${NAMES[r]}${r==='baseline'?'':' Agent'}</div><div class="s">waiting</div></div>`).join('');}
function agent(r){const el=$('ag-'+r);if(!el)return;const n=Object.keys(S.run).filter(k=>k.split('|')[0]===r).length;
  const st=n?'run':S.failed[r]?'fail':S.seen[r]?'done':'idle';el.dataset.s=st;
  const turns=S.turns[r]?` · ${S.turns[r]} model turn${S.turns[r]>1?'s':''}`:'';
  el.querySelector('.s').textContent=(st==='run'?(n>1?n+' tasks in parallel':DOING[r]):st==='done'?'done':st==='fail'?'failed':'waiting')+turns;
  const who=[...new Set(Object.keys(S.run).map(k=>k.split('|')[0]))];
  $('live').innerHTML=who.length?`<span class="shimmer">${who.map(w=>NAMES[w]).join(' + ')} ${who.length>1?'working in parallel':DOING[who[0]]}…</span>`:'';}
function meters(){const m=(l,v)=>`<span class="meter">${l} <b>${v}</b></span>`;     /* plain counters: the run's own limits are not shown */
  const k=v=>v>=1000?(v/1000).toFixed(v>=100000?0:1)+'k':String(v);
  $('meters').innerHTML=m('Elapsed',Math.round(S.t)+' s')+m('Tool calls',S.n.tool)
    +(S.n.llm?m('Model calls',S.n.llm):'')+(S.n.tokens?m('Tokens',k(S.n.tokens)):'')
    +(S.system==='multi'?m('Review round',S.round):'');}

/* ---------- feed helpers ---------- */
function atBottom(){return feed.scrollHeight-feed.scrollTop-feed.clientHeight<140;}
function add(el){const stick=atBottom();feed.appendChild(el);if(stick)feed.scrollTop=feed.scrollHeight;return el;}
function into(parent,el){const stick=atBottom();parent.appendChild(el);if(stick)feed.scrollTop=feed.scrollHeight;return el;}
function h(html){const d=document.createElement('div');d.innerHTML=html.trim();return d.firstElementChild;}
function tm(t){return t==null?'':`<span class="tm">${Number(t).toFixed(1)} s</span>`;}
function block(role,title,t){const b=h(`<div class="blk" style="--c:var(--${role==='code'?'reporting':role})"><div class="bh"><span class="badge">${NAMES[role][0]}</span><span class="who">${NAMES[role]}${['code','baseline'].includes(role)?'':' Agent'}</span><span>${esc(title)}</span>${tm(t)}</div></div>`);
  S.block=add(b);S.reasonBlk=null;return b;}
function slim(text,cls,parent){const el=h(`<div class="slim ${cls||''}">${text}</div>`);return parent?into(parent,el):add(el);}
function refs(ids){return (ids||[]).map(i=>`<button class="ref" data-f="${esc(i)}">${esc(i)}</button>`).join('');}
function taskCard(id){return S.tasks[id]&&S.tasks[id].el;}
function cardFor(ev){if(ev.task&&taskCard(ev.task))return taskCard(ev.task);
  const run=S.order.filter(id=>S.tasks[id].agent===ev.agent&&S.tasks[id].status==='running');if(run.length)return S.tasks[run[run.length-1]].el;
  const any=S.order.filter(id=>S.tasks[id].agent===ev.agent);if(any.length)return S.tasks[any[any.length-1]].el;
  if(S.system==='single'){if(!S.solo){const b=block('baseline','one loop, all six tools',ev.t);S.solo=into(b,h(`<div class="task" style="--c:var(--baseline)"></div>`));}return S.solo;}
  return null;}
function setStatus(id,status,label){const T=S.tasks[id];if(!T)return;T.status=status;
  const c=T.el.querySelector('.st');c.className='chip st '+({running:'c',done:'ok',failed:'no',error:'w'}[status]||'');c.textContent=label||status;}
function argStr(a){return Object.entries(a||{}).map(([k,v])=>k+'='+(typeof v==='string'?v:JSON.stringify(v))).join('  ');}
function pretty(s){try{return JSON.stringify(JSON.parse(s),null,1);}catch(e){return s;}}

/* ---------- event rendering ---------- */
function render(e){
  if(e.t!=null){S.t=Math.max(S.t,Number(e.t));}
  if(e.stats){if(e.stats.tool_calls!=null)S.n.tool=e.stats.tool_calls;if(e.stats.llm_calls!=null)S.n.llm=e.stats.llm_calls;
    if(e.stats.tokens!=null)S.n.tokens=e.stats.tokens;if(e.stats.round)S.round=Math.max(S.round,e.stats.round);}
  traceLine(e);
  switch(e.kind){
  case 'start': break;
  case 'agent_start':{S.run[e.agent+'|'+(e.task||'')]=1;S.seen[e.agent]=1;delete S.failed[e.agent];agent(e.agent);break;}
  case 'agent_end':{delete S.run[e.agent+'|'+(e.task||'')];if(e.ok===false)S.failed[e.agent]=1;agent(e.agent);break;}
  case 'llm_turn':{S.turns[e.agent]=(S.turns[e.agent]||0)+1;agent(e.agent);break;}
  case 'task_created':{
    const key='plan:'+e.origin+':'+(e.round||S.round);
    if(!S.block||S.block.dataset.key!==key){const title=e.origin==='plan'?'split the investigation into tasks':e.origin==='critic'?'turned the Critic\'s requests into follow-up tasks':'used the default plan (planner failed)';
      block('orchestrator',title,e.t).dataset.key=key;}
    const el=h(`<div class="task" style="--c:var(--${e.agent})"><div class="th"><span class="chip mono">${esc(e.id)}</span><span class="who">${NAMES[e.agent]} Agent</span>
      ${e.depends_on&&e.depends_on.length?`<span class="chip">after ${esc(e.depends_on.join(', '))}</span>`:''}<span class="chip st">queued</span></div>
      <div class="obj clamp" title="Click to expand">${esc(e.objective)}</div></div>`);
    S.tasks[e.id]={el,agent:e.agent,status:'pending'};S.order.push(e.id);into(S.block,el);break;}
  case 'wave':{const p=e.parallel||[];slim(p.length>1?`▸ ${esc(p.join(' and '))} now run <b>in parallel</b>`:`▸ ${esc(p[0])} runs`+(S.tasks[p[0]]&&S.tasks[p[0]].el.querySelector('.chip:not(.mono):not(.st)')?' (its dependencies are done)':''));break;}
  case 'task_start':{setStatus(e.id,'running',e.attempt>1?'running · attempt '+e.attempt:'running');
    const T=S.tasks[e.id];if(T){S.run[T.agent+'|'+e.id]=1;S.seen[T.agent]=1;agent(T.agent);}break;}
  case 'tool_call':{const p=cardFor(e);S.n.tool=Math.max(S.n.tool,e.stats&&e.stats.tool_calls||0)||S.n.tool+1;
    const st=!e.ok?`<span class="chip no">failed: ${esc(e.error||'error')}</span>`:e.partial?'<span class="chip w">partial data</span>':'';
    const rt=e.attempts>1?`<span class="chip w">${e.ok?'recovered after':'gave up after'} ${e.attempts} attempts</span>`:'';
    const el=h(`<div class="tool" id="${esc(e.call_id)}" data-open="0" style="--c:var(--${e.agent})"><button type="button"><span class="chip mono">${esc(e.call_id)}</span><span class="tn">${esc(e.tool)}</span><span class="ta">${esc(argStr(e.args))}</span>${st}${rt}</button>
      <div class="tb"><b>Arguments</b><pre>${esc(JSON.stringify(e.args,null,1))}</pre><b>Output the agent saw${e.output_len>(e.output||'').length?` (first ${(e.output||'').length} of ${e.output_len} characters)`:''}${e.latency_ms!=null?' · '+e.latency_ms+' ms':''}</b><pre>${esc(pretty(e.output||'(not recorded)'))}</pre></div></div>`);
    p?into(p,el):add(el);break;}
  case 'finding':{S.findings[e.id]=e;ledger(e);const p=cardFor(e);
    const el=h(`<div class="fnd"><button class="ref" data-f="${esc(e.id)}">${esc(e.id)}</button><span class="x">${esc(e.statement)}</span><span class="chip ${e.verified?'ok':'no'}">${e.verified?'quote verified':'unverified'}</span></div>`);
    p?into(p,el):add(el);break;}
  case 'gap':{const p=cardFor(e);slim('Gap: '+esc(e.description),'w',p||undefined);break;}
  case 'task_done':{const T=S.tasks[e.id];if(T){delete S.run[T.agent+'|'+e.id];agent(T.agent);}setStatus(e.id,'done',`done · ${e.findings} finding${e.findings===1?'':'s'}`);
    if(e.answer)into(taskCard(e.id),h(`<div class="ans"><b>Answer to the task</b>${esc(e.answer)}</div>`));break;}
  case 'task_error':{const T0=S.tasks[e.id];if(T0){delete S.run[T0.agent+'|'+e.id];agent(T0.agent);}setStatus(e.id,'error','error on attempt '+e.attempt);slim('Attempt '+e.attempt+' failed: '+esc(e.error),'b',taskCard(e.id)||undefined);
    const T=S.tasks[e.id];if(T)setTimeout(()=>{if(T.status==='error')setStatus(e.id,'failed','failed · recorded as a gap');},1500);break;}
  case 'task_failed':{const T=S.tasks[e.id];if(T){delete S.run[T.agent+'|'+e.id];agent(T.agent);}setStatus(e.id,'failed','failed · recorded as a gap');break;}
  case 'task_skipped':setStatus(e.id,'','skipped · '+(e.reason||''));break;
  case 'task_deduped':slim('Dropped a duplicate task: '+esc(e.objective));break;
  case 'recovery':slim('↺ Recovery: '+esc(e.what)+(e.error?' ('+esc(e.error)+')':''),'w');break;
  case 'repair':slim('↺ '+NAMES[e.agent]+'\'s output failed schema validation and was sent back for repair','w',cardFor(e)||undefined);break;
  case 'stall':slim('⏸ '+esc(e.note)+': one last review, then stop','w');break;
  case 'hypothesis':{const r=e.round||S.round;
    if(!S.reasonBlk||S.reasonBlk.dataset.round!=r){const first=!Object.keys(S.hyps).length;const b=block('reasoning',first?'formed competing hypotheses':'revised the hypotheses after new evidence',e.t);b.dataset.round=r;S.reasonBlk=b;}
    const prev=S.hyps[e.id];const hist=prev?prev.hist.slice():[];if(!hist.length||hist[hist.length-1].r!==r)hist.push({r,c:e.confidence});else hist[hist.length-1].c=e.confidence;
    S.hyps[e.id]=Object.assign({},prev,e,{hist});
    const old=prev&&hist.length>1?hist[hist.length-2].c:null;const d=old==null?'':e.confidence>old+.004?`<span class="chip ok">▲ from ${old.toFixed(2)}</span>`:e.confidence<old-.004?`<span class="chip no">▼ from ${old.toFixed(2)}</span>`:'<span class="chip">unchanged</span>';
    const row=h(`<div class="hrow ${e.status==='rejected'?'rej':''}" data-h="${esc(e.id)}"><button class="ref" data-hy="${esc(e.id)}">${esc(e.id)}</button><span class="ht">${esc(e.title)} ${e.status==='rejected'?'<span class="chip no">rejected</span>':''} ${d}</span><span class="num">${Number(e.confidence).toFixed(2)}</span><div class="cbar"><u style="width:${e.confidence*100}%"></u></div></div>`);
    const ex=S.reasonBlk.querySelector(`[data-h="${CSS.escape(e.id)}"]`);ex?ex.replaceWith(row):into(S.reasonBlk,row);board();break;}
  case 'critique':{S.cap=e.cap;S.round=Math.max(S.round,e.round||1);const b=block('critic','review round '+e.round,e.t);
    const v={accept:['ok','accepted'],needs_evidence:['w','needs more evidence'],inconclusive:['no','inconclusive']}[e.verdict]||['',e.verdict];
    const sev={blocking:'no',major:'w',minor:''};
    into(b,h(`<div class="crit"><div><span class="chip ${v[0]}">${v[1]}</span> <span class="chip">confidence capped at ${Number(e.cap).toFixed(2)}</span></div><div>${esc(e.summary)}</div>
      ${(e.challenges||[]).length?'<h5>Challenges</h5><ul>'+e.challenges.map(c=>`<li><button class="ref" data-hy="${esc(c.hypothesis_id)}">${esc(c.hypothesis_id)}</button><span class="chip ${sev[c.severity]||''}">${esc(c.severity)}</span> ${esc(c.issue)}</li>`).join('')+'</ul>':''}
      ${(e.evidence_requests||[]).length?'<h5>Sent back for more evidence</h5><ul>'+e.evidence_requests.map(r=>`<li><span class="chip" style="color:var(--${esc(r.agent)})">→ ${esc(NAMES[r.agent]||r.agent)}</span> ${esc(r.question)}</li>`).join('')+'</ul>':''}</div>`));
    board();break;}
  case 'replan':slim('Orchestrator decided to '+esc(e.decision)+': '+esc(e.reason));break;
  case 'outcome':{const b=block('code','applied by code, not by a model',e.t);const inc=e.outcome!=='root_cause_identified';
    into(b,h(`<div class="outc ${inc?'inc':''}"><b>${inc?'Inconclusive':'Root cause identified'}</b>: ${esc(e.why)}<br><span style="color:var(--muted);font-size:12.5px">Investigation ended because: <code>${esc(e.termination||'')}</code></span></div>`));break;}
  case 'done': break;
  case 'report': report(e); break;
  case 'error':add(h(`<div class="outc inc" style="background:var(--bad-bg)"><b>Error</b>: ${esc(e.text)}</div>`));break;
  case 'stopped':S.failed={};S.order.forEach(id=>{if(['running','pending'].includes(S.tasks[id].status))setStatus(id,'','stopped');});slim('■ '+esc(e.text),'w');break;
  }
  meters();
}

/* ---------- right panel ---------- */
function tab(t){[...$('tabs').children].forEach(b=>b.setAttribute('aria-selected',b.dataset.t===t));
  ['hyp','ev','rep','trace'].forEach(x=>$(x).classList.toggle('hide',x!==t));}
$('tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b&&!b.disabled)tab(b.dataset.t);});
function board(){const hs=Object.values(S.hyps).sort((a,b)=>(a.status==='rejected')-(b.status==='rejected')||b.confidence-a.confidence);
  if(!hs.length)return;
  $('hyp').innerHTML=(S.cap!=null?`<div class="slim" style="padding:0">The red tick is the Critic's confidence cap (${Number(S.cap).toFixed(2)}). Code clamps the final confidence to it.</div>`:'')+hs.map((x,i)=>{
    const hist=x.hist&&x.hist.length>1?`<div class="hist">by round: ${x.hist.map(p=>p.c.toFixed(2)).join(' → ')}</div>`:'';
    const chain=(x.chain||x.causal_chain||[]);const sup=x.supporting||x.supporting_evidence||[],con=x.contradicting||x.contradicting_evidence||[];
    const more=(x.statement||chain.length)?`<details ${i===0?'open':''}><summary>statement, causal chain and evidence</summary><div style="margin-top:6px">${esc(x.statement||'')}</div>
      ${chain.length?'<ol>'+chain.map(s=>`<li>${esc(s.claim)} ${s.finding_ids&&s.finding_ids.length?refs(s.finding_ids):'<span class="assumed">(assumed, no evidence)</span>'}</li>`).join('')+'</ol>':''}
      ${sup.length?`<div style="margin-top:6px">Supports: ${refs(sup)}</div>`:''}${con.length?`<div>Contradicts: ${refs(con)}</div>`:''}
      ${(x.assumptions||[]).length?`<div class="assumed" style="margin-top:4px">Assumes: ${x.assumptions.map(esc).join('; ')}</div>`:''}
      ${x.rejection_reason?`<div style="margin-top:4px;color:var(--bad)">Rejected: ${esc(x.rejection_reason)}</div>`:''}</details>`:'';
    return `<div class="hy ${x.status==='rejected'?'rej':''}" id="hy-${esc(x.id)}"><div class="top"><span class="chip mono">${esc(x.id)}</span><span class="ht">${esc(x.title)}</span><span class="num">${Number(x.confidence).toFixed(2)}</span></div>
      <div class="cbar"><u style="width:${x.confidence*100}%"></u>${S.cap!=null?`<s style="left:${S.cap*100}%"></s>`:''}</div>
      <div class="meta">${x.status==='rejected'?'<span class="chip no">rejected</span>':i===0?'<span class="chip c">leading</span>':''}${x.category?`<span class="chip">${esc(x.category)}</span>`:''}${x.service?`<span class="chip">origin: ${esc(x.service)}</span>`:''}${x.trigger?`<span class="chip">trigger: ${esc(x.trigger)}</span>`:''}</div>${hist}${more}</div>`;}).join('');}
function fdHTML(f){const r=(f.refs||[]).map(x=>`<q><button class="ref" data-c="${esc(x.call_id)}">${esc(x.call_id)}</button>“${esc(x.quote)}”</q>`).join('');
  return `<div class="top"><span class="chip mono">${esc(f.id)}</span><span class="chip ${f.verified?'ok':'no'}">${f.verified?'quote verified':'unverified'}</span>${f.finding_kind||f.kind_?`<span class="chip">${esc(f.finding_kind||f.kind_)}</span>`:''}<span class="chip" style="color:var(--${esc(f.agent)})">${esc(NAMES[f.agent]||f.agent)}</span>${f.task?`<span class="chip">${esc(f.task)}</span>`:''}</div>
    <div>${esc(f.statement)}</div>${r}${!f.verified&&f.note?`<div class="assumed">${esc(f.note)}</div>`:''}`;}
function ledger(f){const box=$('ev');if(box.querySelector('.empty'))box.innerHTML='';
  let el=$('fd-'+f.id);if(!el){el=document.createElement('div');el.className='fd';el.id='fd-'+f.id;box.appendChild(el);}
  el.innerHTML=fdHTML(f);const all=Object.values(S.findings);$('evn').textContent=`(${all.filter(x=>x.verified).length}/${all.length} verified)`;}
function traceLine(e){const box=$('trace');const {t,kind,stats,output,report:_r,markdown,truth,...rest}=e;
  const d=document.createElement('div');d.innerHTML=`[${t==null?'    -  ':Number(t).toFixed(2).padStart(7)}s] <span class="k">${esc(kind.padEnd(13))}</span> ${esc(Object.entries(rest).map(([k,v])=>k+'='+(typeof v==='string'?v:JSON.stringify(v))).join(' ').slice(0,400))}`;
  box.appendChild(d);}

function report(e){const r=e.report,st=r.stats||{};S.t=st.latency_s||S.t;S.n.tool=st.tool_calls??S.n.tool;S.n.llm=st.llm_calls??S.n.llm;S.n.tokens=st.total_tokens??S.n.tokens;
  r.findings.forEach(f=>{const x=Object.assign({},S.findings[f.id]||{},f,{finding_kind:f.kind,task:f.task_id,note:f.verification_note});S.findings[f.id]=x;ledger(x);});
  r.ranked_hypotheses.forEach(x=>{const p=S.hyps[x.hypothesis_id]||{hist:[]};S.hyps[x.hypothesis_id]=Object.assign(p,{id:x.hypothesis_id,title:x.title,statement:x.statement,category:x.category,service:x.root_cause_service,
    trigger:x.trigger_change_id,confidence:x.confidence,status:x.status,chain:x.causal_chain,supporting:x.supporting_evidence,contradicting:x.contradicting_evidence,assumptions:x.assumptions,rejection_reason:x.rejection_reason});});
  board();
  const inc=r.outcome!=='root_cause_identified',top=r.ranked_hypotheses.find(x=>x.status==='active');
  const k=v=>v>=1000?(v/1000).toFixed(1)+'k':String(v??'-');
  const pr={immediate:'Now',short_term:'Next',long_term:'Later'};
  const T=e.truth;
  const key=T?`<details class="key"><summary>Answer key (never shown to the agents) ${T.correct?'<span class="chip ok">this run scored correct</span>':T.abstained?'<span class="chip w">abstained on an answerable incident</span>':'<span class="chip no">this run scored wrong</span>'}</summary>
    <div style="margin-top:6px">Expected outcome: <b>${esc(T.expected_outcome)}</b>${T.expected_outcome!=='inconclusive'?` · ${esc(T.category)} in ${T.services.map(s=>'<code>'+esc(s)+'</code>').join(' / ')}${T.trigger_change_id?' · trigger <code>'+esc(T.trigger_change_id)+'</code>':''}`:''}</div><div style="margin-top:4px;color:var(--muted)">${esc(T.narrative)}</div></details>`:'';
  $('rep').innerHTML=`<div class="rp">
    <div class="banner ${inc?'inc':''}"><div class="o">${inc?'Inconclusive':'Root cause identified'}${top&&!inc?': '+esc(top.title):''}</div>
      ${top?`<div style="margin-top:4px">${inc?'Leading hypothesis: '+esc(top.title)+' · ':''}<span class="chip">${esc(top.category)}</span> <span class="chip">origin: ${esc(top.root_cause_service||'unknown')}</span> ${top.trigger_change_id?`<span class="chip">trigger: ${esc(top.trigger_change_id)}</span>`:''} <span class="chip c">confidence ${Number(top.confidence).toFixed(2)} (${esc(top.confidence_label)})</span></div>`:''}</div>
    <div>${esc(r.summary)}</div>${key}
    ${top&&top.causal_chain.length?'<h5>Causal chain</h5><ol>'+top.causal_chain.map(s=>`<li>${esc(s.claim)} ${s.finding_ids.length?refs(s.finding_ids):'<span class="assumed">(assumed)</span>'}</li>`).join('')+'</ol>':''}
    <h5>Ranked hypotheses</h5><table><tr><th>#</th><th>Hypothesis</th><th>Origin</th><th class="r">Confidence</th></tr>${r.ranked_hypotheses.map(x=>`<tr><td>${x.rank}</td><td><button class="ref" data-hy="${esc(x.hypothesis_id)}">${esc(x.hypothesis_id)}</button>${esc(x.title)}${x.status==='rejected'?' <span class="chip no">rejected</span>':''}<div style="margin-top:2px">${x.supporting_evidence.length?'for '+refs(x.supporting_evidence):''}${x.contradicting_evidence.length?' against '+refs(x.contradicting_evidence):''}</div></td><td>${esc(x.root_cause_service||'-')}</td><td class="r">${Number(x.confidence).toFixed(2)}</td></tr>`).join('')}</table>
    ${r.facts.length?'<h5>Facts (verified observations)</h5><ul>'+r.facts.map(f=>`<li>${esc(f.statement)} ${refs(f.finding_ids)}</li>`).join('')+'</ul>':''}
    ${r.assumptions.length?'<h5>Assumptions</h5><ul>'+r.assumptions.map(a=>`<li>${esc(a)}</li>`).join('')+'</ul>':''}
    ${r.timeline.length?'<h5>Timeline</h5><table>'+r.timeline.map(t=>`<tr><td class="mono" style="white-space:nowrap;font-size:12px">${esc(t.time)}</td><td>${esc(t.event)} ${refs(t.finding_ids)}</td></tr>`).join('')+'</table>':''}
    ${r.recommended_actions.length?'<h5>Recommended actions</h5><ul>'+r.recommended_actions.map(a=>`<li><span class="chip ${a.priority==='immediate'?'no':a.priority==='short_term'?'w':''}">${pr[a.priority]||a.priority}</span> <b>${esc(a.action)}</b><br><span style="color:var(--muted)">${esc(a.rationale)}</span> ${refs(a.finding_ids)}</li>`).join('')+'</ul>':''}
    ${r.data_gaps.length?'<h5>Data gaps</h5><ul>'+r.data_gaps.map(a=>`<li>${esc(a)}</li>`).join('')+'</ul>':''}
    ${(r.what_would_change_the_conclusion||[]).length?'<h5>What would change the conclusion</h5><ul>'+r.what_would_change_the_conclusion.map(a=>`<li>${esc(a)}</li>`).join('')+'</ul>':''}
    ${(r.warnings||[]).length?'<h5>Integrity warnings (set by code)</h5><ul>'+r.warnings.map(a=>`<li class="assumed">${esc(a)}</li>`).join('')+'</ul>':''}
    <h5>Run statistics</h5><div class="statg"><div><b>${st.latency_s??'-'} s</b><span>latency</span></div><div><b>${k(st.total_tokens)}</b><span>tokens</span></div><div><b>${st.llm_calls??'-'}</b><span>model calls</span></div>
      <div><b>${st.tool_calls??'-'}</b><span>tool calls</span></div><div><b>${st.tool_failures??0} / ${st.tool_recovered_by_retry??0}</b><span>tool failures / recovered</span></div><div><b>${st.findings_verified??'-'} / ${st.findings??'-'}</b><span>findings verified</span></div>
      <div><b>${st.rounds??'-'}</b><span>review rounds</span></div><div><b>${st.tasks??'-'}</b><span>tasks (${st.tasks_failed??0} failed)</span></div></div>
    <div class="slim" style="padding:0">Ended because <code>${esc(r.termination_reason)}</code>. Saved to <code>${esc(e.saved_to)}/</code> (report.md, report.json, trace.json).</div></div>`;
  $('tabs').querySelector('[data-t=rep]').disabled=false;tab('rep');
  add(h(`<div class="donecard">✓ <b>${inc?'Inconclusive':'Root cause identified'}</b><span>${st.latency_s??'-'} s</span><span>${k(st.total_tokens)} tokens</span><span>${st.tool_calls??'-'} tool calls</span><span>${st.findings_verified??0}/${st.findings??0} findings verified</span><span>The full report is in the Report tab</span></div>`));}

/* cross-links: finding chip -> evidence ledger, call chip -> its tool row, hypothesis chip -> board */
document.addEventListener('click',e=>{
  const o=e.target.closest('.obj.clamp');if(o){o.classList.remove('clamp');return;}
  const th=e.target.closest('.tool>button');if(th&&!e.target.closest('.ref')){const t=th.parentElement;t.dataset.open=t.dataset.open==='1'?'0':'1';return;}
  const b=e.target.closest('button.ref');if(!b)return;
  const go=(el,tb)=>{if(!el)return;if(tb)tab(tb);el.scrollIntoView({block:'center',behavior:'smooth'});el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');};
  if(b.dataset.f)go($('fd-'+b.dataset.f),'ev');
  else if(b.dataset.hy)go($('hy-'+b.dataset.hy),'hyp');
  else if(b.dataset.c){const el=$(b.dataset.c);if(el){el.dataset.open='1';go(el);}}
});

/* ---------- run ---------- */
function setBusy(b){busy=b;const g=$('go');g.classList.toggle('stop',b);g.textContent=b?'Stop':(opt.mode==='live'?'Investigate':'Replay');
  document.querySelectorAll('.bar select').forEach(s=>s.disabled=b);document.querySelectorAll('.bar .seg button').forEach(s=>s.disabled=b||(s.dataset.v==='live'&&META&&!META.has_key));
  clearInterval(tick);if(b&&opt.mode==='live'){const t0=performance.now()-S.t*1000;tick=setInterval(()=>{S.t=Math.max(S.t,(performance.now()-t0)/1000);meters();},500);}}
function finish(){if(es){es.close();es=null;}setBusy(false);Object.keys(S.run).forEach(k=>delete S.run[k]);ROLES[S.system].forEach(agent);$('live').textContent='';}
async function start(){
  const live=opt.mode==='live';const i=currentIncident();
  const sys=live?opt.sys:(META.recordings.find(r=>r.id===$('rec').value)||{}).system||'multi';
  S=fresh(sys);strip();meters();feed.innerHTML='';if(i)add(h(`<div class="u-msg">${incidentHTML(i)}</div>`));
  ['hyp','ev','rep','trace'].forEach(x=>$(x).innerHTML='');$('evn').textContent='';$('tabs').querySelector('[data-t=rep]').disabled=true;tab('hyp');
  $('hyp').innerHTML='<div class="empty"><p>Waiting for the first hypotheses…</p></div>';$('ev').innerHTML='<div class="empty"><p>No findings yet.</p></div>';
  setBusy(true);
  const body=live?{incident_id:$('inc').value,system:opt.sys,llm:opt.llm,chaos:$('chaos').value,crash_agent:opt.sys==='multi'?$('crash').value:''}:{recording:$('rec').value,speed:$('speed').value};
  let j;try{const r=await fetch(live?'/api/run':'/api/replay',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});j=await r.json();}
  catch(err){j={error:'Could not reach the server: '+err.message};}
  if(j.error){render({kind:'error',text:j.error});finish();return;}
  jobId=j.job_id;es=new EventSource('/api/stream/'+jobId);
  es.onmessage=m=>{try{render(JSON.parse(m.data));}catch(err){console.error(err,m.data);}};
  es.addEventListener('end',finish);
}
$('go').addEventListener('click',()=>{if(busy){if(jobId)fetch('/api/stop/'+jobId,{method:'POST'});}else start();});

/* ---------- boot ---------- */
(async function(){
  try{META=await (await fetch('/api/meta')).json();}catch(e){feed.innerHTML='<div class="empty"><p>Could not load the incident list from the server.</p></div>';return;}
  $('inc').innerHTML=META.incidents.map(i=>`<option value="${esc(i.id)}">${esc(i.id)} · ${esc(i.title)}</option>`).join('');
  const sets={};META.recordings.forEach(r=>(sets[r.set]=sets[r.set]||[]).push(r));
  const names=Object.keys(sets).sort((a,b)=>(b.includes("'v4'")-a.includes("'v4'"))||a.localeCompare(b));
  $('recset').innerHTML=names.map(s=>`<option value="${esc(s)}">${esc(s)} (${sets[s].length})</option>`).join('');
  if(names.length)fillRecs(false);
  if(!META.recordings.length)$('mode').children[1].disabled=true;
  if(!META.has_key){const live=$('mode').children[0];live.disabled=true;live.title='Set LLM_API_KEY in .env to run a new investigation';
    if(META.recordings.length)setSeg('mode','mode','replay');}       /* no key: replays still work */
  const q=new URLSearchParams(location.search);
  if(q.get('incident')&&META.incidents.some(i=>i.id===q.get('incident')))$('inc').value=q.get('incident');
  if(q.get('recording')&&META.recordings.some(r=>r.id===q.get('recording'))){setSeg('mode','mode','replay');selectRecording(q.get('recording'));}
  if(['multi','single'].includes(q.get('system')))setSeg('sys','sys',q.get('system'));
  if(q.get('speed'))$('speed').value=q.get('speed');
  syncMode();
  if(q.get('autostart'))start();
})();
</script>
